name: 秋招雷达日报

on:
  schedule:
    # GitHub cron 常延迟（数分钟~数小时，偶尔丢弃），无法根治 → 用"提前+多点"化解：
    # 早间三连，谁先成功谁产出当日推送，其余被去重守卫秒级跳过（几乎零成本）。
    # 正常日子 07:30 前后即达，留足 ~1.5h 缓冲；任一触发点准点即达，全被拖才走兜底。
    - cron: '30 23 * * *'  # 主① 北京 07:30（UTC 前一日 23:30）
    - cron: '15 0 * * *'   # 主② 北京 08:15
    - cron: '0 1 * * *'    # 主③ 北京 09:00
    # 兜底簇：早间三连全被延迟时补位（当天已出报告则自动跳过，不重复推送）。
    - cron: '23 2 * * *'   # 兜底① 北京 10:23
    - cron: '0 4 * * *'    # 兜底② 北京 12:00（深度兜底，极端延迟也不丢）
  workflow_dispatch:       # 允许手动触发（受下方防抢跑守卫约束）
    inputs:
      force:
        description: '强制运行：当天日报未出时手动跑会抢跑当天定时推送。确认要跑填 true。'
        type: boolean
        default: false
      repush:
        description: '补推：不重新抓取，把已入库的岗位按当前配置重新推送一次（改了方向/评分配置后用）'
        type: boolean
        default: false
      repush_date:
        description: '补推哪一天（留空=今天）。跨零点后想补推昨天的，填 2026-07-27 这种格式'
        type: string
        default: ''

permissions:
  contents: write          # commit 日报归档需要写权限
  actions: read            # 快照兜底恢复要列出/下载历史 run 的 artifact

# 同一时刻只允许一个实例运行：防止定时跑与手动跑并发恢复同一份旧库、
# 各自写出两份分叉状态（后到的排队等待，不取消先到的）
concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai    # 统一北京时间，日期计算不跨日
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 岗位库 jobs.db 可再生、不进 git，用 Actions cache 在每日运行间接力：
      # key 带 run_id 保证精确匹配永远落空，从而走 restore-keys 前缀匹配，
      # 恢复出"最近一次保存"的库 —— 实现每日增量对比。
      - name: 恢复岗位数据库（Actions cache）
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      # Cache 只是加速通道（保留期短、可被驱逐，不能当唯一状态库）。
      # 未命中时从最近一次运行上传的快照 artifact（90 天保留）恢复，去掉状态单点。
      - name: 快照兜底恢复（cache 未命中时）
        if: ${{ hashFiles('data/jobs.db') == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Cache 未命中，尝试从最近运行的快照 artifact 恢复..."
          for id in $(gh run list --workflow daily.yml --limit 20 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" --name jobs-db-snapshot --dir data/ 2>/dev/null; then
              echo "已从 run $id 恢复数据库快照"
              break
            fi
          done
          if [ -f data/jobs.db ]; then
            echo "快照恢复成功"
          else
            echo "无可用快照，将执行首次全量初始化"
          fi

      # 恢复来的库（无论来自 cache 还是快照 artifact）先做 SQLite 完整性校验，
      # 不合格就丢弃 → 触发全量重建，绝不拿一个可能损坏的库当增量基线。
      - name: 校验恢复的数据库完整性
        if: ${{ hashFiles('data/jobs.db') != '' }}
        run: |
          if python -c "import sqlite3,sys; sys.exit(0 if sqlite3.connect('data/jobs.db').execute('PRAGMA integrity_check').fetchone()[0]=='ok' else 1)"; then
            echo "数据库完整性 OK"
          else
            echo "⚠️ 恢复的数据库未通过完整性校验，丢弃并将全量重建"
            rm -f data/jobs.db
          fi

      # 触发守卫（去重 + 防抢跑，单一真源见 domain/delivery.py，退出码见 ops_guard.py）：
      #   10=定时去重命中（当天已推过→跳过）  20=防抢跑拦截（手动+当天未出→需 force）  0=继续
      - name: 触发守卫（去重 + 防抢跑）
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          REPUSH: ${{ inputs.repush }}
        run: |
          set +e
          python ops_guard.py
          code=$?
          set -e
          if [ "$code" = "10" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          elif [ "$code" = "20" ]; then
            echo "::error::手动触发被防抢跑守卫拦截（当天日报未出，会抢占定时推送）。确需补跑带 force=true。"
            exit 1
          elif [ "$code" = "0" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "::error::触发守卫异常退出码 $code"; exit "$code"
          fi

      - name: 运行抓取
        if: steps.guard.outputs.skip != 'true'
        env:
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          WECOM_KEY: ${{ secrets.WECOM_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          # 补推：不抓取，把今天已入库的岗位按当前配置重新推一次（改配置后用）
          if [ "${{ inputs.repush }}" = "true" ]; then
            if [ -n "${{ inputs.repush_date }}" ]; then
              python main.py --repush --date="${{ inputs.repush_date }}"
            else
              python main.py --repush
            fi
          # 库不存在（首次部署 / cache 失效）就全量初始化，否则日常增量
          elif [ -f data/jobs.db ]; then
            python main.py
          else
            python main.py --full
          fi

      - name: 保存岗位数据库（Actions cache）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}

      # 快照是"下一次的恢复基线"，晋级前必须验完整性——绝不把损坏/缺失的库当基线上传。
      - name: 快照晋级前完整性校验
        id: snapcheck
        if: always()
        run: |
          if [ -f data/jobs.db ] && python -c "import sqlite3,sys; sys.exit(0 if sqlite3.connect('data/jobs.db').execute('PRAGMA integrity_check').fetchone()[0]=='ok' else 1)"; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "数据库无效或缺失，本次不晋级为恢复快照"
          fi

      - name: 上传数据库快照（90 天持久兜底）
        if: ${{ always() && steps.snapcheck.outputs.ok == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: jobs-db-snapshot
          path: data/jobs.db
          retention-days: 90
          if-no-files-found: ignore

      - name: 导出投递追踪表
        if: always()
        run: python tracker.py export || true

      - name: 写入 Actions 运行摘要
        if: always()
        run: |
          TODAY=$(date +%Y-%m-%d)
          if [ -f "reports/${TODAY}.md" ]; then
            cat "reports/${TODAY}.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "今日简报未生成，请检查运行日志" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 提交简报归档
        if: always()
        run: |
          git config user.name "campus-radar-bot"
          git config user.email "bot@campus-radar.local"
          git add reports/ || true
          if git diff --staged --quiet; then
            echo "今日无变化，无需提交"
            exit 0
          fi
          git commit -m "📰 秋招雷达日报 $(date +%Y-%m-%d)"
          # 推送前 rebase 远端并重试，避免与手动提交撞成非 fast-forward
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push origin HEAD:main; then
              echo "推送成功"; exit 0
            fi
            echo "推送被拒（远端已更新），重试 $i/3..."
            sleep 3
          done
          echo "重试用尽，本次归档提交失败（不影响明日运行）"
